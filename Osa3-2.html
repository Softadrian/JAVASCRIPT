<!DOCTYPE html>
<html>
    <body>
        <script>
    let almanPähkinät = 10
    let brunonPähkinät = 0

    if (almanPähkinät > 5) {
        brunonPähkinät = almanPähkinät/2
        almanPähkinät = almanPähkinät/2
    }

    alert("Almalla on " + almanPähkinät + " pähkinää. Brunolla on " + brunonPähkinät + " pähkinää.")
</script>
    </body>
</html>
