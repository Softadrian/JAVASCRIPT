<!DOCTYPE html>
<html>
    <body>
        <h1>Reaktiopeli</h1>

    <button id="nappi">Start</button>

    <p id="teksti"></p>

    <script>
        nappi.onclick = () => {
        teksti.textContent = "Wait..."

        setTimeout(() => {
        teksti.textContent = "CLICK!"
        let aika = Date.now()

        teksti.onclick = () => {
            alert(Date.now() - aika + " ms")
        }
        }, Math.random() * 3000 + 1000)
}
    </script>
    </body>
</html>
