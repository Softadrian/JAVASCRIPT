<!DOCTYPE html>
<html>
    <body>
<p id="teksti">Klikkaa minua.</p>

<script>
    teksti.onclick = () => {
        if (teksti.textContent === "Klikkaa minua.") {
            teksti.textContent = "Moikka moi!";
        } else {
            teksti.textContent = "Klikkaa minua.";
        }
    };
</script>

    </body>
</html>
