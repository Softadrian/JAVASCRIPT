<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Variables</h1>
<!-- Tulostetaan automerkkejä -->
<p id="demo"></p> 
<p id="demo2"></p>
<p id="demo3"></p>
<p id="demo4"></p>

<script>
// alustetaan muuttujat

let carName = "Volvo";
var carName2 = 'Saab';
const carName3 = "Mercedes Benz" // puolipiste (;) voidaan jättää rivin lopusta
carName4 = 'Ford'; //välttämättä ei tarvitse alustaa muuttujan tyyppiä

// asetetaan arvot tulostuksiin
document.getElementById("demo").innerHTML = carName;
document.getElementById("demo2").innerHTML = carName2;
document.getElementById("demo3").innerHTML = carName3;
document.getElementById("demo4").innerHTML = carName4;
</script>
</body>
</html>
