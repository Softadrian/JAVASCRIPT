
<!DOCTYPE html>
<html>
<body>

<script>
var a = 12;
var b = 6;

alert("Muuttujan a arvo on " + a + " ja muuttujan b arvo on " + b);

var yhteensa = a + b;
alert("Yhteenlaskun tulos on " + yhteensa);

var erotus = a - b;
alert("Vähennyslaskun tulos on " + erotus);

var tulo = a * b;
alert("Kertolaskun tulos on " + tulo);

var osamäärä = a / b;
alert("Jakolaskun tulos on " + osamäärä);
</script>

</body>
</html>
