<!DOCTYPE html>
<html>
<body>
      <h1>Klikkauspeli</h1>

<button id="kohde">🎯</button>
        
    <! käytän tässä tekoälyä.>
    <p>Pisteet: <span id="pisteet">0</span></p> 
    <p>Aikaa: <span id="aika">30</span></p>

<script>
let pisteet = 0
let aika = 30

kohde.onclick = () => {
    pisteet++
    document.getElementById("pisteet").textContent = pisteet

    kohde.style.position = "absolute"
    kohde.style.left = Math.random() * 500 + "px"
    kohde.style.top = Math.random() * 300 + "px"
}

let peli = setInterval(() => {
    aika--
    document.getElementById("aika").textContent = aika

    //käytän tässä tekoälyä kohde.disabled = true
    if (aika == 0) {
        clearInterval(peli)
        kohde.disabled = true
        alert("Peli loppui! Pisteet: " + pisteet)
    }
}, 1000)
</script>  
</body>
</html>
