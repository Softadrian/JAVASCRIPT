<!DOCTYPE html>
<html>
    <body>
       <script>
        let brunonPähkinät = Number(prompt("Kuinka monta pähkinää Brunolla on?"));
        if(brunonPähkinät < 10){
          let  pähkinät = Number(prompt("Kuinka monta pähkinää Brunolle annetaan?"));
            brunonPähkinät += pähkinät;
        }

        alert("Brunolla on " + brunonPähkinät + " pähkinää.")
    </script> 
    </body>
</html>
